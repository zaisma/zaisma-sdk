# The only way @zaisma/cli reaches npm: from this repository's main, through npm's trusted publishing with provenance, never
# from a laptop. npm shows the commit that built each version. No token or secret is used anywhere: the only credential is the
# OIDC token that `id-token: write` gives this job. The code was tested before it reached this repository; this job checks the
# package starts and holds what it names before it publishes.
name: Publish CLI

on:
  push:
    branches: [main]
    paths: ["packages/cli/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @zaisma/cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.6.2
      - name: Is this version new?
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@zaisma/cli@$VERSION" version >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "@zaisma/cli $VERSION is already on npm: nothing to publish."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "@zaisma/cli $VERSION is new: publishing."
          fi
      # The command starts and lists its commands, and the package holds every file it names.
      - if: steps.version.outputs.is_new == 'true'
        working-directory: packages/cli
        run: |
          node zaisma.mjs help --json | node -e "let text = ''; process.stdin.on('data', (part) => (text += part)).on('end', () => { if (!JSON.parse(text).commands.length) process.exit(1) })"
          npm pack --dry-run
      - if: steps.version.outputs.is_new == 'true'
        working-directory: packages/cli
        run: npm publish --provenance --access public
